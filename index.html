<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise 🎂</title>
  <style>
    body {
      background-color: pink;
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 80px;
      overflow: hidden;
    }

    #mainContent {
      display: none;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    img {
      width: 250px;
      border-radius: 20px;
      margin-top: 20px;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      from { bottom: 0; opacity: 1; }
      to { bottom: 100%; opacity: 0; }
    }
  </style>
</head>

<body>

<!-- Start Screen -->
<div id="start">
  <h2>🎁 I made something special for my muuu🤍🤍</h2>
  <button onclick="showSurprise()">Click Here</button>
</div>

<!-- Surprise Screen -->
<div id="mainContent">
  <h1 id="typingText"></h1>

  <!-- UPDATED IMAGE PATH -->
  <img src="./cake.jpeg" alt="Birthday Image">

  <p>You are the most beautiful part of my life 🤍Miss you at this time🍂 but I hope very few birthday I allow you to celebrate as a bachelor 😂🥰</p>
  <p>When my hands can't reach you, my prayers always will! 🤍✨</p>

  <!-- UPDATED AUDIO PATH -->
  <audio id="music" loop>
    <source src="./song.mpeg" type="audio/mpeg">
  </audio>
</div>

<script>
  function showSurprise() {
    document.getElementById("start").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    typeText();
    setInterval(createHeart, 500);

    document.getElementById("music").play().catch(function(error){
      console.log("Audio play prevented:", error);
    });
  }

  let text = "🎉 🤍Happy Birthday My Love 🤍🎉";
  let i = 0;

  function typeText() {
    if (i < text.length) {
      document.getElementById("typingText").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeText, 100);
    }
  }

  function createHeart() {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 4000);
  }
</script>

</body>
</html>
